name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: go test ./...
      - run: go test -race ./...
      - run: go vet ./...
      # gofmt drift reached the repository once already and sat there unnoticed,
      # because nothing checked it.
      - name: gofmt
        run: ./scripts/check-gofmt.sh
      # The only check that exercises build -> apply -> scan -> rollback as one
      # chain. It runs entirely inside a temporary directory.
      - name: closed loop
        run: ./scripts/demo-apply-scan-loop.sh

  # darwin/arm64 behavioural verification, the tier roadmap P1 wants proven
  # rather than merely cross-compiled: macos-latest is Apple Silicon. It runs
  # exactly what the linux job runs, so the two cannot drift apart.
  #
  # Started as a probe with continue-on-error to find out what actually broke
  # (thirteen tests, all path-spelling assumptions, no production change). Now
  # that it is green the tolerance is gone -- a check that cannot fail reports
  # nothing. Add it to the required status checks in branch protection so it
  # gates merges the way the linux jobs do.
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: sw_vers && uname -m && go version
      - run: go test ./...
      - run: go vet ./...
      - name: gofmt
        run: ./scripts/check-gofmt.sh
      - name: closed loop
        run: ./scripts/demo-apply-scan-loop.sh
      - name: installer regression
        run: ./scripts/test-install.sh

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      # golangci-lint-action v7+ requires golangci-lint v2, while v6 still
      # runs on deprecated Node.js 20. Install the pinned v1 linter directly
      # with the setup-go toolchain, matching scripts/bootstrap-dev.sh.
      - name: install golangci-lint
        env:
          GOBIN: ${{ runner.temp }}/aiah-bin
          GOTOOLCHAIN: local
        run: go install github.com/golangci/golangci-lint/cmd/golangci-lint@v1.62.2
      - name: lint
        env:
          LINT_BIN: ${{ runner.temp }}/aiah-bin/golangci-lint
        run: '"$LINT_BIN" run ./...'

  install-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: ./scripts/test-install.sh

  # Cross-compilation only. Per ADR-0003 section 4 this proves the code builds
  # for a platform, never that its behaviour was verified there: Windows chmod,
  # shebang and config-root semantics need their own acceptance tests before
  # Windows can be called supported.
  build-matrix:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -trimpath -o /dev/null ./cmd/aiah
