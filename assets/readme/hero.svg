<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
  <title id="title">AI Asset Hub project hero</title>
  <desc id="desc">A terminal-inspired control surface showing Claude, Codex, and Grok assets flowing through a versioned asset library into preview, apply, and health checks.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0D1117"/>
      <stop offset="1" stop-color="#111923"/>
    </linearGradient>
    <linearGradient id="signal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58A6FF"/>
      <stop offset="1" stop-color="#3FB950"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#010409" flood-opacity=".5"/>
    </filter>
  </defs>

  <rect width="1200" height="440" rx="28" fill="url(#background)"/>
  <path d="M0 86H1200M0 354H1200" stroke="#21262D"/>
  <path d="M86 0V440M1114 0V440" stroke="#161B22"/>
  <circle cx="1072" cy="48" r="4" fill="#3FB950"/>
  <circle cx="1090" cy="48" r="4" fill="#58A6FF"/>
  <circle cx="1108" cy="48" r="4" fill="#8B949E"/>

  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="84" y="58" fill="#8B949E" font-size="15" font-weight="700" letter-spacing="2.2">TERMINAL-FIRST ASSET CONTROL</text>
    <text x="84" y="145" fill="#E6EDF3" font-size="58" font-weight="760">AI Asset Hub</text>
    <text x="84" y="181" fill="#B1BAC4" font-size="21">把散落的 AI 编程资产，整理成一份</text>
    <text x="84" y="210" fill="#B1BAC4" font-size="21">可迁移、可审阅、可恢复的资产库。</text>

    <g transform="translate(84 230)">
      <rect width="112" height="34" rx="17" fill="#161B22" stroke="#30363D"/>
      <circle cx="20" cy="17" r="5" fill="#58A6FF"/>
      <text x="34" y="23" fill="#E6EDF3" font-size="16" font-weight="650">Claude</text>
      <rect x="124" width="104" height="34" rx="17" fill="#161B22" stroke="#30363D"/>
      <circle cx="144" cy="17" r="5" fill="#3FB950"/>
      <text x="158" y="23" fill="#E6EDF3" font-size="16" font-weight="650">Codex</text>
      <rect x="240" width="96" height="34" rx="17" fill="#161B22" stroke="#30363D"/>
      <circle cx="260" cy="17" r="5" fill="#D2A8FF"/>
      <text x="274" y="23" fill="#E6EDF3" font-size="16" font-weight="650">Grok</text>
    </g>

    <g transform="translate(84 286)" filter="url(#shadow)">
      <rect width="420" height="74" rx="16" fill="#010409" stroke="#30363D"/>
      <circle cx="22" cy="18" r="4" fill="#FF7B72"/>
      <circle cx="38" cy="18" r="4" fill="#D29922"/>
      <circle cx="54" cy="18" r="4" fill="#3FB950"/>
      <text x="24" y="52" fill="#3FB950" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="22" font-weight="700">&gt;</text>
      <text x="52" y="52" fill="#E6EDF3" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="22">aiah ui</text>
      <text x="352" y="51" fill="#8B949E" font-size="13">START HERE</text>
    </g>
  </g>

  <g transform="translate(650 104)" filter="url(#shadow)">
    <rect width="466" height="238" rx="22" fill="#0D1117" stroke="#30363D"/>
    <rect x="1" y="1" width="464" height="48" rx="21" fill="#161B22"/>
    <circle cx="24" cy="25" r="5" fill="#3FB950"/>
    <text x="40" y="31" fill="#E6EDF3" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="17" font-weight="700">~/ai-assets</text>
    <text x="356" y="30" fill="#8B949E" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="13">versioned</text>

    <path d="M28 78H438M28 126H438M28 174H438" stroke="#21262D"/>
    <g font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="15">
      <text x="28" y="104" fill="#58A6FF">manifest.yaml</text>
      <text x="308" y="104" fill="#8B949E">source of truth</text>
      <text x="28" y="152" fill="#E6EDF3">assets/skills/review</text>
      <text x="314" y="152" fill="#3FB950">claude · codex</text>
      <text x="28" y="200" fill="#E6EDF3">assets/rules/default</text>
      <text x="344" y="200" fill="#D2A8FF">grok</text>
    </g>
    <rect x="28" y="216" width="410" height="4" rx="2" fill="#21262D"/>
    <rect x="28" y="216" width="292" height="4" rx="2" fill="url(#signal)"/>
  </g>

  <g font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="14" font-weight="700">
    <text x="666" y="382" fill="#8B949E">discover</text>
    <text x="752" y="382" fill="#484F58">→</text>
    <text x="778" y="382" fill="#58A6FF">library</text>
    <text x="852" y="382" fill="#484F58">→</text>
    <text x="878" y="382" fill="#E6EDF3">diff</text>
    <text x="924" y="382" fill="#484F58">→</text>
    <text x="950" y="382" fill="#3FB950">apply</text>
    <text x="1006" y="382" fill="#484F58">→</text>
    <text x="1032" y="382" fill="#D2A8FF">doctor</text>
  </g>
  <text x="84" y="406" fill="#8B949E" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14">TECHNICAL PREVIEW  ·  LINUX AMD64  ·  READ-ONLY FIRST</text>
</svg>
